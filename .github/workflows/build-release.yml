name: Build and Release (userscript)

on:
    push:
        branches:
            - injection

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: monkey

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install

            - name: Build with Rollup
              run: npm run build

            - name: Read version from package.json
              id: pkg
              run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

            - name: Create/Update injection release
              uses: softprops/action-gh-release@v2
              with:
                  name: Injection Branch Latest Build
                  tag_name: ${{ github.ref_name }}
                  draft: false
                  prerelease: true
                  files: monkey/dist/**
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create versioned release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}-${{ steps.pkg.outputs.version }}
                  name: Injection Build ${{ steps.pkg.outputs.version }}
                  draft: false
                  prerelease: true
                  files: monkey/dist/**
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
